<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Mapes històrics · Visor d'anotacions</title>
  </head>
  <body>
    <div class="app">
      <main>
        <div class="toolbar" aria-label="Capes d'anotacions">
          <label><input type="checkbox" id="detections" /><span class="swatch object"></span>Deteccions <span id="detection-count" class="count">—</span></label>
          <button id="categories" type="button" popovertarget="category-filter" disabled>Categories <span id="category-count" class="count">—</span> <span aria-hidden="true">▾</span></button>
          <label><input type="checkbox" id="paragraphs" /><span class="swatch text"></span>Paràgrafs i text <span id="paragraph-count" class="count">—</span></label>
          <button id="information" type="button" aria-haspopup="dialog" disabled>Informació</button>
        </div>
        <div class="workspace">
          <section class="map-shell" aria-label="Mapa interactiu">
            <div id="viewer" tabindex="0" aria-label="Mapa: utilitzeu els controls per ampliar, reduir i centrar"></div>
            <div class="map-tools" aria-label="Navegació del mapa">
              <button id="zoom-in" aria-label="Amplia" title="Amplia">+</button>
              <button id="zoom-out" aria-label="Redueix" title="Redueix">−</button>
              <button id="home" aria-label="Mostra el mapa sencer" title="Mostra el mapa sencer">⌂</button>
            </div>
            <div class="map-hint" id="map-hint">Arrossega per moure · Desplaça per ampliar</div>
            <div id="empty-state"><h2 id="empty-title">Carregant el mapa…</h2><p id="empty-detail">Connectant amb la Cartoteca Digital.</p><button id="retry" hidden>Torna-ho a provar</button></div>
          </section>
          <aside id="text-panel" hidden aria-label="Transcripcions">
            <div class="panel-heading"><h2>Paràgrafs i text</h2><button id="close-text" aria-label="Tanca les transcripcions">×</button></div>
            <p class="panel-intro">Selecciona una regió del mapa o un paràgraf de la llista.</p>
            <nav id="region-list" aria-label="Llista de paràgrafs"></nav>
            <div id="transcription" tabindex="-1"></div>
          </aside>
        </div>
        <div class="status-line">
          <div class="status-message">
            <p id="status" role="status" aria-live="polite">Carregant el mapa…</p>
            <button id="retry-annotations" hidden>Torna a carregar les anotacions</button>
            <button id="retry-image" hidden>Torna a carregar la imatge</button>
          </div>
          <span class="ai-notice">Anotacions generades amb IA</span>
        </div>
      </main>
    </div>
    <div id="category-filter" popover="auto">
      <fieldset>
        <legend>Categories de detecció</legend>
        <div class="filter-actions"><button id="categories-all" type="button">Totes</button><button id="categories-none" type="button">Cap</button></div>
        <div id="category-list"></div>
      </fieldset>
    </div>
    <dialog id="information-dialog" aria-labelledby="information-title">
      <div class="panel-heading dialog-heading">
        <h2 id="information-title">Informació del mapa</h2>
        <button id="close-information" aria-label="Tanca la informació" autofocus>×</button>
      </div>
      <div class="dialog-content">
        <h3 id="map-title"></h3>
        <p id="record"></p>
        <section id="metadata" aria-label="Informació i atribució del mapa" hidden>
          <div id="attribution"></div><dl id="metadata-list"></dl>
        </section>
        <a id="source" hidden target="_blank" rel="noopener noreferrer" aria-label="Manifest IIIF, s'obre en una pestanya nova">Manifest IIIF ↗</a>
      </div>
    </dialog>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
