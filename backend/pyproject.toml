[project]
name = "icgc-viewer"
version = "0.1.0"
description = "Small IIIF Presentation 2 enrichment service and map viewer"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3"]

[project.scripts]
icgc-viewer = "icgc_viewer.app:main"
icgc-publish-annotations = "icgc_viewer.publish_annotations:main"
icgc-health = "icgc_viewer.app:health"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
